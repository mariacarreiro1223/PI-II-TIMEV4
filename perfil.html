<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Sistema SADD</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="../js/api.js"></script>
    <script defer src="../js/perfil.js"></script>
</head>
<body class="pagina-detalhes">

    <header>
        <nav>
            <div class="logo">Sistema SADD</div>
            <ul class="menu">
                <li id="link-dashboard"><a href="dashboard.html">Início</a></li>
                <li id="link-demandas"><a href="Listagem_demanda.html">Demandas</a></li>
                <li id="link-projeto"><a href="projetos.html">Projetos</a></li>

    <main>
        <section class="titulo-descricao">

            <p id="nome-perfil"><strong>Nome: </strong> Carregando</p>
            <p id="perfil-perfil"><strong>Perfil: </strong> Carregando</p>

        <div id="box-demandas" hidden>

            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle border">

                        <tr>
                            <th scope="col">ID</th>

                            <th scope="col">CPF</th>
                            <th scope="col">Email</th>

                    </thead>
                    <tbody id="tabela-usuarios">
                        
                        <tr>
                            <th scope="row">1</th>
                            <td class="fw-bold">Usuario Teste</td>
                            <td><span class="badge bg-primary">12345678901</span></td>
                            <td>usuario@email.com</td>
                            <td class="text-center">Membro da Equipe</td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
