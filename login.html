<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <script src="script_login.js" defer></script>

</head>

<body class="pagina-auth">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-9">
                
                <form id="formLogin">
                    <h1>Login</h1>
                    <label for="email">E-mail</label>
                    <input type="email" id="email_id" name="email">
                    <div id="erroEmail" class="invalid-feedback"></div>

                    <label for="senha_id">Senha</label>
                    <input type="password" id="senha_id" name="senha">
                    <div id="erroSenha" class="invalid-feedback"></div>

                    <input type="submit" value="Login">

                    <p>
                        <a href="#">Esqueci minha senha</a><br>
                        <a href="cadastro.html">Cadastre-se</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
