<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>Cadastro</h1>

    <form>

        <p>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">
        </p>

        <p>
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome">
        </p>

        <p>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf">
        </p>

        <p>
        <label for="rg">RG</label>
        <input type="text" id="rg" name="rg">
        </p>

        <p>
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone">
        </p>

        <p>
        <label for="data-nascimento">Data de Nascimento</label>
        <input type="date" id="data-nascimento" name="data-nascimento">
        </p>

        <p>
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco">
        </p>

        <p>
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero">
        </p>

        <p>
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade">
        </p>

        <p>
        <label for="estado">Estado</label>
        <input type="text" id="estado" name="estado">
        </p>

        <p>
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep">
        </p>

        <p>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
        </p>

        <p>
        <label for="confirmar-email">Confirmar E-mail</label>
        <input type="email" id="confirmar-email" name="confirmar-email">
        </p>

        <p>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">
        </p>

        <p>
        <label for="confirmar-senha">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha">
        </p>

        
        <button type="submit">Finalizar Cadastro</button>
    
    </form>
    
    <p>
        <a href="login.html">Já tenho uma conta</a>
    </p>

    </main>
</body>
</html>
