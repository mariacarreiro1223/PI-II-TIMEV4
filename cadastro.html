<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="script_cadastro.js" defer></script>
</head>

<body>
<main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-9">

                <form id="formCadastro" novalidate>
                    <div class="card-body p-4">
                        <div class="row g-3">

                            <h1>Cadastro de usuários</h1>

                            <div class="col-12 col-md-12">
                                <label for="nome">Nome completo</label>
                                <input type="text" id="nome" name="nome">
                                <div id="erroNome"></div>
                            </div>

                            <div class="col-12 col-md-7">
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" name="cpf">
                                <div id="erroCPF"></div>
                            </div>

                            <div class="col-12 col-md-5">
                                <label for="telefone">Telefone</label>
                                <input type="tel" id="telefone" name="telefone">
                                <div id="erroTel"></div>
                            </div>

                            <div class="col-12 col-md-3">
                                <label for="dtnascimento">Data de Nascimento</label>
                                <input type="date" id="dtnascimento" name="data-nascimento">
                                <div id="erroNascimento"></div>
                            </div>

                            <div class="col-12 col-md-9">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" name="email">
                                <div id="erroEmail"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="senha">Senha</label>
                                <input type="password" id="senha" name="senha">
                                <div id="erroSenha"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="confirmar-senha">Confirmar Senha</label>
                                <input type="password" id="confirmar-senha" name="confirmar-senha">
                                <div id="erroConfirmacaoSenha"></div>
                            </div>
                        </div>
                    
                                
                        <input id="botaoEnviar_id" type="submit"  value="Criar usuário">
                        <p>
                            <a href="login.html">Já tenho uma conta</a>
                        </p>
                        <section id="resultado" class="mt-4 d-none">
                            <div class="alert alert-success">
                                Usuário criado com sucesso.
                            </div>
                        </section>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
